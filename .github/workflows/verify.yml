name: Verify builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify x64 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ReduceMemory_x64.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x64 self-test failed with exit code $($process.ExitCode)" }
      - name: Verify x86 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ReduceMemory.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x86 self-test failed with exit code $($process.ExitCode)" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bash syntax
        run: |
          bash -n linux/ReduceMemory_Linux.sh
          bash -n linux/Install_ReduceMemory.sh
          bash -n linux/Install_Server.sh
      - name: Run safe Linux self-check
        run: ./linux/ReduceMemory_Linux.sh check
      - name: Verify user-local launcher installation
        run: |
          install_root="${RUNNER_TEMP}/reduce-memory-install"
          REDUCE_MEMORY_BIN_DIR="${install_root}/bin" \
          REDUCE_MEMORY_APP_DIR="${install_root}/applications" \
            ./linux/Install_ReduceMemory.sh
          test -x "${install_root}/bin/reduce-memory"
          test -f "${install_root}/applications/reduce-memory.desktop"
          grep -F 'Name=Reduce Memory' "${install_root}/applications/reduce-memory.desktop"
          grep -F 'Terminal=true' "${install_root}/applications/reduce-memory.desktop"
          "${install_root}/bin/reduce-memory" check
          menu_output="$(printf '0\n' | "${install_root}/bin/reduce-memory" --menu)"
          grep -F 'Reduce Memory 2.2 - Linux' <<< "${menu_output}"
          grep -F '3. Aggressive' <<< "${menu_output}"
      - name: Verify Linux server installation
        run: |
          server_bin="${RUNNER_TEMP}/reduce-memory-server/bin"
          sudo env REDUCE_MEMORY_SERVER_BIN_DIR="${server_bin}" \
            ./linux/Install_Server.sh
          test -x "${server_bin}/reduce-memory-server"
          status_output="$("${server_bin}/reduce-memory-server" status)"
          grep -F 'Mode                    : status' <<< "${status_output}"
          server_menu="$(printf '0\n' | "${server_bin}/reduce-memory-server" --menu)"
          grep -F 'Reduce Memory 2.2 - Linux Server' <<< "${server_menu}"
          grep -F '3. Aggressive' <<< "${server_menu}"
