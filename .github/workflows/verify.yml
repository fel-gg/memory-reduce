name: Verify builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify x64 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ReduceMemory_x64.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x64 self-test failed with exit code $($process.ExitCode)" }
          $monitor = Start-Process -FilePath .\windows\ReduceMemory_x64.exe -ArgumentList /RMMONITORSELFTEST -Wait -PassThru
          if ($monitor.ExitCode -ne 0) { throw "x64 monitor logic failed with exit code $($monitor.ExitCode)" }
      - name: Verify x86 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ReduceMemory.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x86 self-test failed with exit code $($process.ExitCode)" }
          $monitor = Start-Process -FilePath .\windows\ReduceMemory.exe -ArgumentList /RMMONITORSELFTEST -Wait -PassThru
          if ($monitor.ExitCode -ne 0) { throw "x86 monitor logic failed with exit code $($monitor.ExitCode)" }
      - name: Verify real Windows working-set trim
        shell: pwsh
        run: |
          $targetScript = Join-Path $env:RUNNER_TEMP 'reduce-memory-target.ps1'
          @'
          $buffer = [byte[]]::new(256MB)
          for ($offset = 0; $offset -lt $buffer.Length; $offset += 4096) { $buffer[$offset] = 1 }
          Start-Sleep -Seconds 30
          '@ | Set-Content -LiteralPath $targetScript -Encoding UTF8
          foreach ($binary in @('.\windows\ReduceMemory_x64.exe', '.\windows\ReduceMemory.exe')) {
            $target = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-WindowStyle','Hidden','-File', $targetScript -PassThru
            $resultPath = Join-Path $env:RUNNER_TEMP ("trim-{0}.result" -f [IO.Path]::GetFileName($binary))
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              do {
                if ($target.HasExited) { throw "$binary disposable target exited before trim" }
                $resident = (Get-Process -Id $target.Id).WorkingSet64
                if ($resident -ge 128MB) { break }
                Start-Sleep -Milliseconds 100
              } while ([DateTime]::UtcNow -lt $deadline)
              if ($resident -lt 128MB) { throw "$binary disposable target never became resident" }
              $probe = Start-Process -FilePath $binary -ArgumentList '/RMTRIMTEST', $target.Id, $resultPath -Wait -PassThru
              if ($probe.ExitCode -ne 0) { throw "$binary real trim failed with exit code $($probe.ExitCode)" }
              if ($target.HasExited) { throw "$binary terminated the disposable target" }
              $measurements = @(Get-Content -LiteralPath $resultPath | ForEach-Object { [int64]$_ })
              if ($measurements.Count -ne 2) { throw "$binary did not return structured measurements" }
              $reduced = $measurements[0] - $measurements[1]
              if ($reduced -lt 64MB) { throw "$binary reduced only $reduced bytes from a disposable 256 MB target" }
              Write-Output "$binary measured working-set reduction: $([math]::Round($reduced / 1MB, 1)) MB"
            } catch {
              $failure = $_.Exception.Message -replace '[\r\n]+', ' '
              Write-Output "::error title=Targeted trim $binary::$failure"
              throw
            } finally {
              if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
            }
          }
      - name: Verify full Windows Aggressive engine
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $target = $null
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Write-Output "Aggressive runner elevated: $isAdmin"
            if (-not $isAdmin) {
              throw 'The disposable Aggressive integration gate requires an elevated Windows runner'
            }

            $targetSource = @'
            using System;
            using System.Threading;

            public static class ReduceMemoryAggressiveTarget
            {
                public static void Main()
                {
                    byte[] buffer = new byte[256 * 1024 * 1024];
                    for (int offset = 0; offset < buffer.Length; offset += 4096)
                        buffer[offset] = 1;
                    Thread.Sleep(TimeSpan.FromSeconds(60));
                    GC.KeepAlive(buffer);
                }
            }
          '@
            $targetExe = Join-Path $env:RUNNER_TEMP 'ReduceMemoryAggressiveTarget.exe'
            $targetCs = Join-Path $env:RUNNER_TEMP 'ReduceMemoryAggressiveTarget.cs'
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $targetSource | Set-Content -LiteralPath $targetCs -Encoding UTF8
            & $csc /nologo /target:exe "/out:$targetExe" $targetCs
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $targetExe)) {
              throw "Disposable Aggressive target compilation failed with exit code $LASTEXITCODE"
            }
            $target = Start-Process -FilePath $targetExe -WindowStyle Hidden -PassThru
            $resultPath = Join-Path $env:RUNNER_TEMP 'aggressive.result'
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              if ($target.HasExited) { throw 'Disposable Aggressive target exited before reclaim' }
              $resident = (Get-Process -Id $target.Id).WorkingSet64
              if ($resident -ge 128MB) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($resident -lt 128MB) { throw 'Disposable Aggressive target never became resident' }

            $worker = Start-Process -FilePath .\windows\ReduceMemory_x64.exe `
              -ArgumentList '/RMAGGRESSIVE',("/RMRESULT=$resultPath") -Wait -PassThru
            if ($worker.ExitCode -ne 0) { throw "Aggressive worker failed with exit code $($worker.ExitCode)" }
            if ($target.HasExited) { throw 'Aggressive terminated the disposable target' }

            $fields = @(Get-Content -LiteralPath $resultPath | ForEach-Object { [int64]$_ })
            if ($fields.Count -ne 6) { throw "Aggressive returned $($fields.Count) fields instead of 6" }
            $trimOperations = $fields[1]
            $workingSetReduction = $fields[2]
            $nativeStages = $fields[3]
            $processPasses = $fields[4]
            if ($trimOperations -lt 1) { throw 'Aggressive did not trim an eligible process' }
            if ($workingSetReduction -lt 64MB) { throw "Aggressive measured only $workingSetReduction bytes of working-set reduction" }
            if ($nativeStages -lt 4) { throw "Aggressive completed only $nativeStages of 6 native stages" }
            if ($processPasses -ne 2) { throw "Aggressive completed $processPasses process passes instead of 2" }
            Write-Output "Aggressive: $trimOperations trims, $([math]::Round($workingSetReduction / 1MB, 1)) MB working set, $nativeStages/6 native stages, $processPasses passes"
          } catch {
            $failure = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Output "::error title=Aggressive integration::$failure"
            throw
          } finally {
            if ($null -ne $target -and -not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bash syntax
        run: |
          bash -n linux/ReduceMemory_Linux.sh
          bash -n linux/desktop/Install_Desktop.sh
          bash -n linux/server/Install_Server.sh
          python3 -m py_compile linux/native/reduce-memory-native
          python3 - <<'PY'
          import importlib.machinery
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path('linux/native/reduce-memory-native')
          loader = importlib.machinery.SourceFileLoader('reduce_memory_native', str(path))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          module = importlib.util.module_from_spec(spec)
          sys.modules[loader.name] = module
          loader.exec_module(module)
          ranges = [(0, 1000, 100), (1, 2000, 200), (2, 3000, 300)]
          remaining, touched = module.remaining_ranges(ranges, 150)
          assert touched == {0, 1}
          assert remaining == [(1, 2050, 150), (2, 3000, 300)]
          PY
      - name: Verify native Linux process page-out
        run: |
          native_check="$(linux/native/reduce-memory-native check)"
          grep -F 'native_status=supported' <<< "${native_check}"

          mapped_file="${RUNNER_TEMP}/reduce-memory-native-target.bin"
          ready_file="${RUNNER_TEMP}/reduce-memory-native-ready"
          python3 -c '
          import mmap, pathlib, sys, time
          path, ready = sys.argv[1], sys.argv[2]
          size = 128 * 1024 * 1024
          with open(path, "w+b") as target:
              target.truncate(size)
              with mmap.mmap(target.fileno(), size) as mapped:
                  checksum = 0
                  for offset in range(0, size, 4096):
                      checksum ^= mapped[offset]
                  pathlib.Path(ready).write_text(str(checksum))
                  time.sleep(60)
          ' "${mapped_file}" "${ready_file}" &
          target_pid=$!
          trap 'kill "${target_pid}" 2>/dev/null || true; wait "${target_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..50}; do
            test -f "${ready_file}" && break
            sleep 0.1
          done
          test -f "${ready_file}"
          rss_before="$(awk '/^VmRSS:/ { print $2 }' "/proc/${target_pid}/status")"
          native_exit=0
          native_output="$(sudo linux/native/reduce-memory-native pageout \
            --pid "${target_pid}" --min-rss-mb 1 --min-mapping-kb 64 \
            --activity-ms 0 --settle-ms 750)" || native_exit=$?
          printf '%s\n' "${native_output}"
          test "${native_exit}" -eq 0
          rss_after="$(awk '/^VmRSS:/ { print $2 }' "/proc/${target_pid}/status")"
          bytes_advised="$(awk -F= '$1 == "bytes_advised" { print $2 }' <<< "${native_output}")"
          rss_reduced="$(awk -F= '$1 == "rss_reduced_kb" { print $2 }' <<< "${native_output}")"
          batch_calls="$(awk -F= '$1 == "batch_calls" { print $2 }' <<< "${native_output}")"

          grep -E '^native_status=(done|partial)$' <<< "${native_output}"
          test "${bytes_advised}" -gt 0
          test "${rss_reduced}" -gt 16384
          test "${batch_calls}" -gt 0
          test "${rss_after}" -lt "${rss_before}"

          protected_output="$(sudo linux/native/reduce-memory-native pageout \
            --pid "${target_pid}" --min-rss-mb 1 --activity-ms 0 --settle-ms 0 \
            --protect-pattern reduce-memory-native-target.bin)"
          grep -F 'native_status=no_candidates' <<< "${protected_output}"
          grep -F 'workloads_protected=1' <<< "${protected_output}"
          kill "${target_pid}"
          wait "${target_pid}" || true
          trap - EXIT
      - name: Run safe Linux self-check
        run: |
          check_output="$(./linux/ReduceMemory_Linux.sh check)"
          grep -F 'Mode                    : check' <<< "${check_output}"
          grep -F 'File cache released     :' <<< "${check_output}"
          grep -F 'Anonymous RAM change    :' <<< "${check_output}"
          grep -F 'Swap current            :' <<< "${check_output}"
          grep -F 'Default Aggressive ask  :' <<< "${check_output}"
          grep -F 'Native process page-out : supported' <<< "${check_output}"
          grep -F 'cgroup memory.reclaim   :' <<< "${check_output}"
      - name: Exercise native Smooth and Aggressive paths
        run: |
          mock_root="${RUNNER_TEMP}/reduce-memory-kernel-mock"
          mkdir -p "${mock_root}/vm" "${mock_root}/cgroup"
          cat > "${mock_root}/meminfo" <<'EOF'
          MemTotal:       16777216 kB
          MemAvailable:   10485760 kB
          Cached:          2097152 kB
          SReclaimable:     262144 kB
          Shmem:             65536 kB
          AnonPages:       4194304 kB
          SwapTotal:       4194304 kB
          SwapFree:        3145728 kB
          EOF
          : > "${mock_root}/vm/drop_caches"
          : > "${mock_root}/cgroup/memory.reclaim"
          cat > "${mock_root}/reduce-memory-native" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "check" ]]; then
            printf 'native_status=supported\n'
            exit 0
          fi
          if [[ -n "${REDUCE_MEMORY_TEST_ARGS_FILE:-}" ]]; then
            printf '%s\n' "$@" > "${REDUCE_MEMORY_TEST_ARGS_FILE}"
          fi
          cat <<'RESULT'
          native_status=done
          processes_seen=12
          processes_advised=4
          processes_active_skipped=3
          processes_protected=2
          workloads_protected=2
          mappings_advised=28
          bytes_advised=536870912
          rss_reduced_kb=393216
          batch_calls=3
          fallback_calls=0
          RESULT
          EOF
          chmod +x "${mock_root}/reduce-memory-native"

          common_env=(
            "REDUCE_MEMORY_MEMINFO_FILE=${mock_root}/meminfo"
            "REDUCE_MEMORY_VM_ROOT=${mock_root}/vm"
            "REDUCE_MEMORY_TARGET_CGROUP=${mock_root}/cgroup"
            "REDUCE_MEMORY_NATIVE_HELPER=${mock_root}/reduce-memory-native"
            "REDUCE_MEMORY_TARGET_UID=1000"
            "REDUCE_MEMORY_SETTLE_SECONDS=0"
            "REDUCE_MEMORY_TEST_ARGS_FILE=${mock_root}/native-args"
          )

          normal_output="$(sudo env "${common_env[@]}" ./linux/ReduceMemory_Linux.sh normal)"
          grep -Fx -- '--min-rss-mb' "${mock_root}/native-args"
          grep -Fx -- '256' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          ! grep -Fx -- '--include-service-users' "${mock_root}/native-args"
          grep -F 'Native process page-out : pass1=done' <<< "${normal_output}"
          grep -F 'Native page-out passes  : 1' <<< "${normal_output}"
          grep -F 'drop_caches             : not requested' <<< "${normal_output}"

          smooth_output="$(sudo env "${common_env[@]}" ./linux/ReduceMemory_Linux.sh smooth)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '1'
          grep -Fx -- '128' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          grep -F 'Native process page-out : pass1=done' <<< "${smooth_output}"
          grep -F 'drop_caches             : done (level 1)' <<< "${smooth_output}"
          grep -F 'cgroup memory.reclaim   : not requested' <<< "${smooth_output}"

          ai_output="$(sudo env "${common_env[@]}" ./linux/ReduceMemory_Linux.sh ai-shield)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '1'
          test ! -s "${mock_root}/cgroup/memory.reclaim"
          grep -F 'Mode                    : ai-shield' <<< "${ai_output}"
          grep -F 'AI/GPU workloads safe   : 2' <<< "${ai_output}"
          grep -F 'drop_caches             : not requested' <<< "${ai_output}"
          grep -F 'cgroup memory.reclaim   : not requested' <<< "${ai_output}"
          grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          grep -Fx -- '--protect-pattern' "${mock_root}/native-args"

          aggressive_output="$(sudo env "${common_env[@]}" REDUCE_MEMORY_RECLAIM_MB=1024 ./linux/ReduceMemory_Linux.sh aggressive)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '3'
          test "$(tr -d '\n' < "${mock_root}/cgroup/memory.reclaim")" = '1024M swappiness=max'
          grep -F 'drop_caches             : done (level 3)' <<< "${aggressive_output}"
          grep -F 'Native process page-out : pass1=done; pass2=done' <<< "${aggressive_output}"
          grep -F 'Native page-out passes  : 2' <<< "${aggressive_output}"
          grep -F 'Process RSS reduced     : 768 MB' <<< "${aggressive_output}"
          grep -F 'Batched native calls    : 6' <<< "${aggressive_output}"
          grep -F 'Scalar fallback calls   : 0' <<< "${aggressive_output}"
          grep -F 'cgroup memory.reclaim   : done (1024 MB requested) | swappiness=max' <<< "${aggressive_output}"
          grep -F "Reclaim scope           : ${mock_root}/cgroup" <<< "${aggressive_output}"
          grep -Fx -- '--all-users' "${mock_root}/native-args"
          grep -Fx -- '32' "${mock_root}/native-args"
          grep -Fx -- '256' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          ! grep -Fx -- '--include-service-users' "${mock_root}/native-args"

          : > "${mock_root}/cgroup/memory.reclaim"
          sudo env "${common_env[@]}" REDUCE_MEMORY_RECLAIM_MB=1024 \
            REDUCE_MEMORY_RECLAIM_SWAPPINESS=default \
            ./linux/ReduceMemory_Linux.sh aggressive >/dev/null
          test "$(tr -d '\n' < "${mock_root}/cgroup/memory.reclaim")" = '1024M'

          cp ./linux/ReduceMemory_Linux.sh "${mock_root}/reduce-memory-server"
          chmod +x "${mock_root}/reduce-memory-server"
          sudo env "${common_env[@]}" REDUCE_MEMORY_RECLAIM_MB=1024 \
            "${mock_root}/reduce-memory-server" aggressive >/dev/null
          grep -Fx -- '--all-users' "${mock_root}/native-args"
          grep -Fx -- '--include-service-users' "${mock_root}/native-args"
      - name: Verify user-local launcher installation
        run: |
          install_root="${RUNNER_TEMP}/reduce-memory-install"
          REDUCE_MEMORY_BIN_DIR="${install_root}/bin" \
          REDUCE_MEMORY_APP_DIR="${install_root}/applications" \
            ./linux/desktop/Install_Desktop.sh
          test -x "${install_root}/bin/reduce-memory"
          test -x "${install_root}/bin/reduce-memory-native"
          test -f "${install_root}/applications/reduce-memory.desktop"
          grep -F 'Name=Reduce Memory' "${install_root}/applications/reduce-memory.desktop"
          grep -F 'Terminal=true' "${install_root}/applications/reduce-memory.desktop"
          "${install_root}/bin/reduce-memory" check
          "${install_root}/bin/reduce-memory-native" check
          menu_output="$(printf '0\n' | "${install_root}/bin/reduce-memory" --menu)"
          grep -F 'Reduce Memory 2.8 - Linux' <<< "${menu_output}"
          ! grep -F 'Linux Server' <<< "${menu_output}"
          grep -F '3. AI Shield' <<< "${menu_output}"
          grep -F '4. Aggressive' <<< "${menu_output}"
      - name: Verify Linux server installation
        run: |
          server_bin="${RUNNER_TEMP}/reduce-memory-server/bin"
          sudo env REDUCE_MEMORY_SERVER_BIN_DIR="${server_bin}" \
            ./linux/server/Install_Server.sh
          test -x "${server_bin}/reduce-memory-server"
          test -x "${server_bin}/reduce-memory-native"
          test ! -e "${server_bin}/reduce-memory"
          test ! -e "${server_bin}/reduce-memory.desktop"
          status_output="$("${server_bin}/reduce-memory-server" status)"
          grep -F 'Mode                    : status' <<< "${status_output}"
          grep -F 'Native process page-out : supported' <<< "${status_output}"
          server_menu="$(printf '0\n' | "${server_bin}/reduce-memory-server" --menu)"
          grep -F 'Reduce Memory 2.8 - Linux Server' <<< "${server_menu}"
          grep -F '3. AI Shield' <<< "${server_menu}"
          grep -F '4. Aggressive' <<< "${server_menu}"
